appId: com.aichat.desktop
productName: aichat
npmRebuild: false
asar: false
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!electron/bin"
  - "!node_modules"
  - "!server"
  - "!server-dist/data"
  - "!test-files"
  - "!scripts"
  - "!*.md"
  - "!*.ts"
  - "!tsconfig.json"
win:
  target:
    - target: zip
      arch: [x64]
  icon: build/icon.ico
  signAndEditExecutable: false
electronLanguages:
  - zh-CN
  - en-US
extraResources:
  # 便携版 Node.js 运行时
  - from: electron/bin/node.exe
    to: node.exe
  # 编译后的后端代码
  - from: server-dist
    to: server-dist
  # 后端生产依赖（仅 server/node_modules，不含前端和构建工具）
  - from: server/node_modules
    to: node_modules
  # 预置桌宠（首启自动安装到 ~/.aichat/pets/）
  - from: assets/pets
    to: preset-pets
