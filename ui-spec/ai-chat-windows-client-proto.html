<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat — Windows 客户端（方案B · 高保真）</title>
<style>
/* ===== 方案B · 高保真 — 侧边栏反相 + 高饱和蓝紫 accent ===== */
:root {
  --sidebar-bg:    #dadfef;
  --bg:            #e8edf7;
  --surface:       #f5f7fc;
  --chat-bg:       #f5f7fc;
  --fg:            #3d4f70;
  --muted:         #6b7c9e;
  --muted-soft:    #8c9ab6;
  --border:        rgba(70, 85, 120, 0.1);
  --border-soft:   rgba(70, 85, 120, 0.05);
  --accent:        #5570b8;
  --accent-hover:  #4460a8;
  --accent-dim:    rgba(85, 112, 184, 0.1);
  --accent-soft:   rgba(85, 112, 184, 0.35);

  --user-bubble:   #e8edf7;
  --ai-bubble:     #dfe5f4;
  --hover-bg:      #d2d9ed;
  --active-bg:     #cbd4e8;

  --success:       #4a9e6e;
  --warn:          #c9a43b;
  --danger:        #d4606a;

  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  --font-mono:    'Cascadia Code', 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, 'Consolas', monospace;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --radius-full: 9999px;

  --titlebar-h: 42px;
  --sidebar-w: 262px;
  --sidebar-w-mini: 212px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  color: var(--fg);
  background: #354060;
  background-image: radial-gradient(ellipse at 50% 30%, #4a5980 0%, #2d3655 80%);
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== 桌面窗口 ===== */
.desktop-window {
  background: var(--bg);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 2px 4px rgba(0,0,0,0.04),
    0 8px 24px rgba(30,38,64,0.12),
    0 24px 64px rgba(30,38,64,0.25),
    0 40px 100px rgba(30,38,64,0.35);
  display: flex; flex-direction: column;
  transition: width 0.45s cubic-bezier(0.32, 0.72, 0, 1),
              height 0.45s cubic-bezier(0.32, 0.72, 0, 1);
  position: relative;
  backdrop-filter: blur(0);
}
.desktop-window.fullscreen { width: 1200px; height: 800px; }
.desktop-window.mini {
  width: 900px; height: 680px;
  resize: both;
  min-width: 600px; min-height: 460px;
  max-width: 95vw; max-height: 90vh;
}
.resize-handle {
  position: absolute; bottom: 0; right: 0;
  width: 18px; height: 18px;
  cursor: nwse-resize; z-index: 100; opacity: 1;
  background: linear-gradient(135deg,
    transparent 0%, transparent 50%,
    var(--border) 50%, var(--border) calc(50% + 1px),
    transparent calc(50% + 1px), transparent calc(50% + 5px),
    var(--border) calc(50% + 5px), var(--border) calc(50% + 6px),
    transparent calc(50% + 6px));
}

/* ===== 标题栏 ===== */
.titlebar {
  height: var(--titlebar-h);
  background: var(--sidebar-bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 14px;
  user-select: none; flex-shrink: 0; z-index: 10;
}
.titlebar-icon {
  width: 24px; height: 24px; border-radius: 7px;
  background: linear-gradient(135deg, var(--accent), #7b92ce);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 700;
  font-family: var(--font-display); letter-spacing: -0.02em;
  margin-right: 10px; flex-shrink: 0;
  box-shadow: 0 1px 3px rgba(68, 96, 168, 0.25);
}
.titlebar-title {
  font-family: var(--font-display); font-size: 12px; font-weight: 500;
  letter-spacing: 0.01em; color: var(--muted); flex: 1;
}
.window-controls { display: flex; gap: 0; margin-left: auto; }
.window-controls button {
  width: 46px; height: 32px; border: none; background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  border-radius: 0; transition: background 0.12s, color 0.12s; color: var(--muted);
}
.window-controls button:hover { background: var(--hover-bg); }
.window-controls .wc-close:hover { background: var(--danger); color: #fff; }
.window-controls button svg { width: 10px; height: 10px; }

/* ===== 主布局 ===== */
.app-body {
  display: flex; flex: 1; min-height: 0; overflow: hidden; position: relative;
}

/* ============ 侧边栏 ============ */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0; background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  transition: width 0.45s cubic-bezier(0.32, 0.72, 0, 1);
}
.desktop-window.mini .sidebar { width: var(--sidebar-w-mini); }

/* 上半块 */
.sidebar-top {
  padding: 14px 10px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.assistant-select-row { display: flex; gap: 6px; align-items: center; }
.assistant-dropdown-wrap { flex: 1; position: relative; min-width: 0; }
.assistant-dropdown-btn {
  width: 100%; display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--surface);
  font-size: 13px; font-family: var(--font-body); font-weight: 500;
  color: var(--fg); cursor: pointer;
  transition: all 0.15s; letter-spacing: -0.01em;
  box-shadow: 0 1px 2px rgba(70, 85, 120, 0.04);
}
.assistant-dropdown-btn:hover { border-color: var(--accent); background: #fff; box-shadow: 0 1px 4px rgba(85, 112, 184, 0.1); }
.assistant-dropdown-emoji { font-size: 16px; flex-shrink: 0; }
.assistant-dropdown-name { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.assistant-dropdown-arrow { color: var(--muted-soft); font-size: 10px; flex-shrink: 0; transition: transform 0.2s; }

.dropdown-menu {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: 0 4px 16px rgba(40, 50, 80, 0.08), 0 10px 32px rgba(40, 50, 80, 0.12);
  z-index: 40; overflow: hidden;
  animation: menu-in 0.15s cubic-bezier(0.16, 1, 0.3, 1);
  padding: 4px;
}
.dropdown-item {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 8px 10px; border-radius: var(--radius-sm); border: none; background: transparent;
  font-size: 13px; font-family: var(--font-body); color: var(--fg);
  cursor: pointer; transition: background 0.1s; letter-spacing: -0.01em;
}
.dropdown-item:hover { background: var(--accent-dim); color: var(--accent); }
.dropdown-item-emoji { font-size: 15px; flex-shrink: 0; }
.dropdown-item-name { flex: 1; text-align: left; font-weight: 500; }

.sidebar-btn {
  width: 32px; height: 32px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; transition: all 0.15s; flex-shrink: 0;
}
.sidebar-btn:hover { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
.sidebar-btn.primary {
  background: linear-gradient(135deg, var(--accent), #6a82ce);
  color: #fff; border-color: transparent;
  box-shadow: 0 1px 3px rgba(68, 96, 168, 0.2);
}
.sidebar-btn.primary:hover { background: var(--accent-hover); box-shadow: 0 2px 6px rgba(68, 96, 168, 0.3); }

.gear-menu {
  position: absolute; top: 100%; right: 0; margin-top: 4px; z-index: 41;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: 0 4px 16px rgba(40, 50, 80, 0.08), 0 10px 32px rgba(40, 50, 80, 0.12);
  min-width: 130px; overflow: hidden; padding: 4px;
  animation: menu-in 0.12s cubic-bezier(0.16, 1, 0.3, 1);
}
.gear-menu-item {
  display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 8px 12px; border-radius: var(--radius-sm); border: none; background: transparent;
  font-size: 13px; font-family: var(--font-body); color: var(--fg);
  cursor: pointer; transition: background 0.1s; letter-spacing: 0.01em;
}
.gear-menu-item:hover { background: var(--accent-dim); color: var(--accent); }
.gear-menu-item.danger:hover { background: rgba(212, 96, 106, 0.08); color: var(--danger); }

/* 下半块 */
.sidebar-middle { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.sidebar-middle-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 10px 6px; flex-shrink: 0;
}
.sidebar-middle-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted-soft);
}
.sidebar-new-chat-btn {
  padding: 4px 10px; border-radius: var(--radius-full);
  border: 1px dashed var(--accent); background: transparent;
  color: var(--accent); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
  font-family: var(--font-body); letter-spacing: 0.01em;
}
.sidebar-new-chat-btn:hover { background: var(--accent-dim); }

.sidebar-conv-list { flex: 1; overflow-y: auto; padding: 0 6px 4px; }
.sidebar-conv-list::-webkit-scrollbar { width: 5px; }
.sidebar-conv-list::-webkit-scrollbar-track { background: transparent; }
.sidebar-conv-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.sidebar-conv-list::-webkit-scrollbar-thumb:hover { background: var(--muted-soft); }

.assistant-group { margin-bottom: 6px; }
.assistant-group-name {
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
  color: var(--muted-soft); padding: 6px 8px 4px; text-transform: uppercase;
}
.conv-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: var(--radius-sm);
  cursor: pointer; transition: all 0.12s; position: relative;
}
.conv-item::before {
  content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
  width: 3px; border-radius: 0 2px 2px 0;
  background: transparent; transition: background 0.15s;
}
.conv-item:hover { background: var(--hover-bg); }
.conv-item.active { background: var(--accent-dim); color: var(--accent); }
.conv-item.active::before { background: var(--accent); }
.conv-item-title {
  font-size: 13px; font-weight: 500; letter-spacing: -0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
  line-height: 1.4;
}
.conv-item-meta {
  font-size: 10px; color: var(--muted-soft); letter-spacing: 0.02em;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums; flex-shrink: 0;
}

.sidebar-bottom {
  padding: 8px 10px; border-top: 1px solid var(--border); flex-shrink: 0;
}
.sidebar-settings-btn {
  width: 100%; display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 8px 0; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: transparent;
  font-size: 12px; font-weight: 500; letter-spacing: 0.02em;
  color: var(--muted); cursor: pointer;
  transition: all 0.15s; font-family: var(--font-body);
}
.sidebar-settings-btn:hover { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

/* ============ 聊天区 ============ */
.chat-area {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
  background: linear-gradient(180deg, var(--chat-bg) 0%, #f0f3fa 100%);
}
.chat-header {
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0; background: var(--surface);
  backdrop-filter: blur(8px);
}
.desktop-window.mini .chat-header { padding: 10px 14px; }
.chat-header-emoji {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  background: var(--accent-dim); display: flex; align-items: center;
  justify-content: center; font-size: 15px;
}
.chat-header-name {
  font-family: var(--font-display); font-size: 14px; font-weight: 600;
  letter-spacing: -0.01em; color: var(--fg);
}
.chat-header-model {
  font-size: 11px; color: var(--muted); background: var(--chat-bg);
  padding: 3px 8px; border-radius: var(--radius-full);
  border: 1px solid var(--border-soft);
  letter-spacing: 0.01em; font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}
.chat-header-spacer { flex: 1; }
.privacy-badge {
  font-size: 11px; padding: 4px 12px; border-radius: var(--radius-full);
  letter-spacing: 0.03em; display: flex; align-items: center; gap: 6px;
  cursor: pointer; transition: all 0.2s;
  font-family: var(--font-body); font-weight: 600;
  border: 1px solid var(--border); background: var(--chat-bg); color: var(--muted);
}
.privacy-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; transition: all 0.2s;
}
.privacy-badge.on {
  background: var(--accent); color: #fff; border-color: var(--accent);
  box-shadow: 0 1px 4px rgba(85, 112, 184, 0.25);
}

/* 消息列表 */
.message-list {
  flex: 1; overflow-y: auto; padding: 20px 20px 8px;
  display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth;
}
.desktop-window.mini .message-list { padding: 14px 14px 4px; gap: 12px; }
.message-list::-webkit-scrollbar { width: 5px; }
.message-list::-webkit-scrollbar-track { background: transparent; }
.message-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.message-list::-webkit-scrollbar-thumb:hover { background: var(--muted-soft); }

.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); }
.empty-state-icon {
  width: 56px; height: 56px; border-radius: var(--radius-xl);
  background: var(--accent-dim); display: flex; align-items: center;
  justify-content: center; font-size: 24px;
}
.empty-state-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: var(--fg); }
.empty-state-desc { font-size: 13px; color: var(--muted-soft); letter-spacing: 0.01em; }

.message { display: flex; gap: 12px; max-width: 720px; animation: msg-in 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
.message.user { align-self: flex-end; flex-direction: row-reverse; }
@keyframes msg-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.message-avatar {
  width: 32px; height: 32px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0; font-weight: 700;
  letter-spacing: -0.02em; font-family: var(--font-display);
}
.message.ai .message-avatar {
  background: linear-gradient(135deg, var(--accent-dim), rgba(85, 112, 184, 0.2));
  color: var(--accent); border: 1px solid rgba(85, 112, 184, 0.15);
}
.message.user .message-avatar { background: var(--active-bg); color: var(--fg); }
.message-content { flex: 1; min-width: 0; }
.message-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.message-sender { font-size: 12px; font-weight: 600; letter-spacing: 0.01em; color: var(--fg); }
.message-time { font-size: 11px; color: var(--muted-soft); letter-spacing: 0.02em; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.message-body {
  font-size: 14px; line-height: 1.7; color: var(--fg);
  padding: 14px 18px; border-radius: var(--radius-lg);
}
.message.ai .message-body { background: var(--ai-bubble); border: none; }
.message.user .message-body { background: var(--user-bubble); border: none; }

/* 代码块 */
.message-body pre {
  background: #2e3858; color: #e2e8f4; padding: 14px 16px;
  border-radius: var(--radius-md); font-family: var(--font-mono);
  font-size: 13px; line-height: 1.6; overflow-x: auto;
  margin: 8px 0; tab-size: 2;
}
.message-body pre::-webkit-scrollbar { height: 4px; }
.message-body pre::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
.message-body code {
  font-family: var(--font-mono); font-size: 0.92em;
  background: rgba(70, 85, 120, 0.08); padding: 2px 5px;
  border-radius: 3px; color: var(--accent);
}
.message-body pre code { background: none; padding: 0; border-radius: 0; color: inherit; font-size: inherit; }

.streaming-indicator { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
.streaming-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: dot-bounce 0.7s infinite alternate; }
.streaming-dot:nth-child(2) { animation-delay: 0.23s; }
.streaming-dot:nth-child(3) { animation-delay: 0.47s; }
@keyframes dot-bounce { from { transform: translateY(0); opacity: 0.25; } to { transform: translateY(-7px); opacity: 1; } }

.think-block {
  margin: 8px 0; border: 1px solid var(--border);
  border-radius: var(--radius-md); overflow: hidden;
  background: var(--sidebar-bg);
}
.think-toggle {
  width: 100%; padding: 8px 14px; background: transparent; border: none;
  font-size: 12px; font-weight: 500; letter-spacing: 0.02em; color: var(--muted);
  cursor: pointer; display: flex; align-items: center; gap: 6px;
  font-family: var(--font-body); transition: background 0.12s;
}
.think-toggle:hover { background: var(--hover-bg); }
.think-content {
  padding: 10px 14px 14px; font-size: 13px; color: var(--muted);
  line-height: 1.6; display: none; border-top: 1px solid var(--border);
  font-style: italic;
}
.think-content.open { display: block; }

/* ===== 工具调用 ===== */
.tool-call {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 10px; border-radius: var(--radius-sm);
  font-size: 13px; font-family: var(--font-body);
  letter-spacing: 0.01em; transition: background 0.1s;
  font-style: normal;
}
.tool-call.clickable:hover { background: var(--hover-bg); cursor: pointer; }
.tc-running { color: var(--muted-soft); }
.tc-pulse-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
  animation: tc-pulse 1.2s infinite;
}
@keyframes tc-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
.tc-emoji { flex-shrink: 0; font-size: 14px; width: 22px; text-align: center; }
.tc-text { flex: 1; }
.tc-duration {
  font-size: 11px; font-family: var(--font-mono);
  font-variant-numeric: tabular-nums; color: var(--muted-soft); flex-shrink: 0;
}
.tc-arrow {
  font-size: 13px; color: var(--muted-soft); cursor: pointer;
  padding: 1px 5px; border-radius: 3px; transition: all 0.1s; user-select: none; flex-shrink: 0;
}
.tc-arrow:hover { background: var(--accent-dim); color: var(--accent); }
/* 嵌套组 */
.tc-nested {
  margin-left: 22px; border-left: 1px solid var(--border);
  padding-left: 8px; display: flex; flex-direction: column; gap: 1px;
}
/* 展开详情通用 */
.tc-detail-box {
  display: none; margin: 2px 0 6px 22px;
  border-left: 2px solid var(--border); padding: 4px 0 4px 14px;
}
.tc-detail-box.open { display: block; }
/* 记忆详情项 */
.tc-mem-item {
  display: flex; gap: 12px; align-items: baseline;
  padding: 5px 0; border-bottom: 1px solid var(--border-soft); font-size: 12px;
}
.tc-mem-item:last-child { border-bottom: none; }
.tc-mem-content { flex: 1; color: var(--muted); line-height: 1.5; }
.tc-mem-score { font-family: var(--font-mono); font-size: 11px; color: var(--accent); flex-shrink: 0; }
/* 搜索结果详情项 */
.tc-sr-item { padding: 6px 0; border-bottom: 1px solid var(--border-soft); }
.tc-sr-item:last-child { border-bottom: none; }
.tc-sr-idx { font-family: var(--font-mono); font-size: 11px; color: var(--muted-soft); margin-bottom: 2px; }
.tc-sr-title { font-weight: 500; font-size: 12px; color: var(--accent); margin-bottom: 2px; }
.tc-sr-snippet { font-size: 11px; color: var(--muted-soft); line-height: 1.5; }
/* 网页抓取详情 */
.tc-fetch-title { font-weight: 500; font-size: 13px; color: var(--accent); margin-bottom: 4px; }
.tc-fetch-body {
  font-size: 12px; color: var(--muted); line-height: 1.7;
  max-height: 180px; overflow-y: auto;
}

.message-actions { display: flex; gap: 4px; margin-top: 6px; align-items: center; }
.message-actions button, .message-actions .action-label {
  font-size: 11px; color: var(--muted-soft); background: transparent;
  border: none; cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm);
  letter-spacing: 0.02em; transition: all 0.15s; font-family: var(--font-body);
  display: flex; align-items: center; gap: 3px;
}
.message-actions button:hover { background: var(--accent-dim); color: var(--accent); }
.action-label { cursor: default; }
.token-badge {
  font-family: var(--font-mono); font-size: 10px; color: var(--muted-soft);
  letter-spacing: 0.02em; padding: 3px 7px; border-radius: var(--radius-full);
  border: 1px solid var(--border-soft); font-variant-numeric: tabular-nums;
}

.system-prompt-card {
  padding: 12px 16px; border-radius: var(--radius-md);
  border: 1px dashed var(--border); background: var(--sidebar-bg);
  font-size: 12px; color: var(--muted); letter-spacing: 0.01em;
  cursor: pointer; transition: all 0.15s;
}
.system-prompt-card:hover { border-color: var(--accent); color: var(--accent); background: rgba(85, 112, 184, 0.04); }

/* ============ 输入区 ============ */
.chat-input-area { padding: 10px 20px 16px; flex-shrink: 0; }
.desktop-window.mini .chat-input-area { padding: 8px 14px 12px; }
.input-container {
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  background: var(--surface); overflow: hidden;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  box-shadow: 0 1px 3px rgba(70, 85, 120, 0.04);
}
.input-container:focus-within {
  border-color: var(--accent); background: #fff;
  box-shadow: 0 1px 4px rgba(85, 112, 184, 0.1), 0 0 0 3px rgba(85, 112, 184, 0.06);
}
.input-container textarea {
  display: block; width: 100%; border: none; background: transparent;
  font-size: 14px; font-family: var(--font-body); color: var(--fg);
  line-height: 1.65; padding: 16px 18px 6px; resize: none; outline: none;
  min-height: 68px; max-height: 50vh; overflow-y: auto;
}
.input-container textarea::-webkit-scrollbar { width: 4px; }
.input-container textarea::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.input-container textarea::placeholder { color: var(--muted-soft); letter-spacing: 0.01em; }
.input-container textarea:disabled { opacity: 0.5; cursor: not-allowed; }
.desktop-window.mini .input-container textarea { font-size: 13px; min-height: 56px; padding: 12px 14px 4px; }

.input-toolbar { display: flex; align-items: center; padding: 6px 12px 12px; gap: 6px; }
.control-toggle {
  display: flex; align-items: center; gap: 5px; padding: 5px 10px;
  border-radius: var(--radius-full); border: 1px solid var(--border);
  background: transparent; font-size: 12px; font-weight: 500;
  letter-spacing: 0.02em; color: var(--muted); cursor: pointer;
  transition: all 0.2s; font-family: var(--font-body);
}
.control-toggle:hover { border-color: var(--accent); color: var(--accent); background: rgba(85, 112, 184, 0.04); }
.control-toggle.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 1px 3px rgba(85, 112, 184, 0.2); }
.toggle-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

.upload-btn {
  display: flex; align-items: center; gap: 4px; padding: 5px 10px;
  border-radius: var(--radius-full); border: 1px solid var(--border);
  background: transparent; font-size: 12px; font-weight: 500;
  letter-spacing: 0.02em; color: var(--muted); cursor: pointer;
  transition: all 0.15s; font-family: var(--font-body);
}
.upload-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(85, 112, 184, 0.04); }

.toolbar-spacer { flex: 1; }
.context-indicator {
  font-size: 11px; font-family: var(--font-mono); color: var(--muted-soft);
  letter-spacing: 0.02em; padding: 3px 8px; border-radius: var(--radius-full);
  border: 1px solid var(--border-soft); font-variant-numeric: tabular-nums;
}
.context-indicator.warn { border-color: var(--warn); color: var(--warn); background: rgba(201, 164, 59, 0.06); }

.send-btn {
  width: 36px; height: 36px; border-radius: var(--radius-md); border: none;
  background: linear-gradient(135deg, var(--accent), #6a82ce);
  color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(85, 112, 184, 0.25);
}
.send-btn:hover { background: var(--accent-hover); transform: scale(1.04); box-shadow: 0 3px 10px rgba(85, 112, 184, 0.35); }
.send-btn:active { transform: scale(0.96); transition: all 0.08s; }
.send-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; box-shadow: none; }
.send-btn svg { width: 16px; height: 16px; }

.stop-btn {
  width: 36px; height: 36px; border-radius: var(--radius-md);
  border: 1px solid rgba(212, 96, 106, 0.3);
  background: rgba(212, 96, 106, 0.06);
  color: var(--danger); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0; font-size: 14px; font-weight: 700;
}
.stop-btn:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

.input-footer-text {
  text-align: center; margin-top: 8px; font-size: 11px;
  color: var(--muted-soft); letter-spacing: 0.02em;
}

/* ============ 设置页面 ============ */
.settings-page { flex: 1; display: flex; background: var(--surface); min-width: 0; }
.settings-nav {
  width: var(--sidebar-w); flex-shrink: 0; border-right: 1px solid var(--border);
  background: var(--sidebar-bg); display: flex; flex-direction: column;
}
.settings-nav-item {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  border-radius: var(--radius-md); border: none; background: transparent;
  font-size: 13px; font-weight: 500; letter-spacing: 0.01em;
  color: var(--muted); cursor: pointer; transition: all 0.15s;
  font-family: var(--font-body); text-align: left;
}
.settings-nav-item:hover { background: var(--hover-bg); color: var(--fg); }
.settings-nav-item.active {
  background: var(--accent-dim); color: var(--accent);
  font-weight: 600;
}

.settings-nav-inner {
  flex: 1; display: flex; flex-direction: column; gap: 4px;
  padding: 20px 12px; overflow-y: auto;
}
.settings-nav-inner::-webkit-scrollbar { width: 5px; }
.settings-nav-inner::-webkit-scrollbar-track { background: transparent; }
.settings-nav-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.settings-nav-bottom { padding: 10px 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
.settings-nav-back-btn {
  width: 100%; display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 8px 0; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: transparent;
  font-size: 12px; font-weight: 500; letter-spacing: 0.02em;
  color: var(--muted); cursor: pointer;
  transition: all 0.15s; font-family: var(--font-body);
}
.settings-nav-back-btn:hover { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

.settings-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.settings-content-header {
  padding: 18px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.settings-content-header h3 {
  font-family: var(--font-display); font-size: 17px; font-weight: 600;
  letter-spacing: -0.01em; flex: 1; color: var(--fg);
}

.settings-content-body {
  flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column;
}
.settings-content-body::-webkit-scrollbar { width: 5px; }
.settings-content-body::-webkit-scrollbar-track { background: transparent; }
.settings-content-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* 模型设置 */
.model-settings { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.providers-area { flex-shrink: 0; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
.providers-header {
  display: flex; align-items: center; justify-content: flex-start; gap: 12px; margin-bottom: 14px;
}
.add-provider-btn {
  padding: 6px 14px; border-radius: var(--radius-full);
  border: 1px dashed var(--accent); background: transparent;
  font-size: 12px; font-weight: 500; letter-spacing: 0.01em;
  color: var(--accent); cursor: pointer; transition: all 0.15s;
  font-family: var(--font-body); display: flex; align-items: center; gap: 4px;
}
.add-provider-btn:hover { background: var(--accent-dim); }

.providers-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted-soft);
}
.provider-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.provider-tab {
  padding: 7px 16px; border-radius: var(--radius-full);
  border: 1px solid var(--border); background: transparent;
  font-size: 13px; font-weight: 500; letter-spacing: 0.01em;
  color: var(--muted); cursor: pointer; transition: all 0.2s;
  font-family: var(--font-body); display: flex; align-items: center; gap: 6px;
}
.provider-tab:hover { border-color: var(--accent); color: var(--accent); }
.provider-tab.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
  box-shadow: 0 1px 4px rgba(85, 112, 184, 0.2);
}
.provider-tab-count {
  font-size: 10px; color: var(--muted-soft);
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  background: rgba(70, 85, 120, 0.06); padding: 1px 6px; border-radius: var(--radius-full);
}
.provider-tab.active .provider-tab-count { background: rgba(255,255,255,0.2); color: #fff; }

.models-area { flex: 1; overflow-y: auto; padding-top: 18px; min-height: 0; }
.models-area::-webkit-scrollbar { width: 5px; }
.models-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.models-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.models-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-soft); }
.add-model-btn {
  padding: 5px 12px; border-radius: var(--radius-full);
  border: 1px dashed var(--accent); background: transparent;
  font-size: 12px; font-weight: 500; letter-spacing: 0.01em;
  color: var(--accent); cursor: pointer; transition: all 0.15s;
  font-family: var(--font-body); display: flex; align-items: center; gap: 4px;
}
.add-model-btn:hover { background: var(--accent-dim); }

.model-list { display: flex; flex-direction: column; gap: 4px; }
.model-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 16px; border-radius: var(--radius-md);
  border: 1px solid var(--border-soft); background: var(--chat-bg);
  transition: all 0.12s;
}
.model-item:hover { background: var(--hover-bg); border-color: var(--border); }
.model-item-name { font-size: 13px; font-weight: 500; letter-spacing: -0.01em; color: var(--fg); }
.model-item-id { font-size: 11px; color: var(--muted-soft); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.select-provider-prompt {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--muted-soft); letter-spacing: 0.01em;
  padding-top: 18px;
}
.no-provider-hint { font-size: 13px; color: var(--muted-soft); letter-spacing: 0.01em; padding: 14px 0; }

/* 设置通用 */
.setting-group { margin-bottom: 28px; }
.setting-group-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted-soft); margin-bottom: 12px;
}
.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--border-soft);
}
.setting-row:last-child { border-bottom: none; }
.setting-row-label { font-size: 13px; font-weight: 500; letter-spacing: -0.01em; color: var(--fg); }
.setting-row-desc { font-size: 11px; color: var(--muted-soft); letter-spacing: 0.01em; }

.toggle-switch {
  width: 42px; height: 24px; border-radius: 12px; border: none;
  cursor: pointer; position: relative; transition: background 0.25s cubic-bezier(0.32, 0.72, 0, 1); flex-shrink: 0;
}
.toggle-switch.off { background: var(--border); }
.toggle-switch.on  { background: var(--accent); box-shadow: 0 1px 3px rgba(85, 112, 184, 0.3); }
.toggle-switch::after {
  content: ''; position: absolute; top: 2px; width: 20px; height: 20px;
  border-radius: 50%; background: #fff; transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
  box-shadow: 0 1px 3px rgba(60, 65, 100, 0.15), 0 0 0 1px rgba(60, 65, 100, 0.04);
}
.toggle-switch.off::after { left: 2px; transform: translateX(0); }
.toggle-switch.on::after  { left: 2px; transform: translateX(18px); }

.setting-input {
  width: 100%; padding: 10px 14px; border-radius: var(--radius-md);
  border: 1px solid var(--border); font-size: 13px; font-family: var(--font-body);
  color: var(--fg); outline: none; background: var(--chat-bg);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.setting-input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(85, 112, 184, 0.06); }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.stat-card {
  padding: 16px; background: var(--chat-bg); border-radius: var(--radius-md);
  border: 1px solid var(--border-soft);
}
.stat-value { font-family: var(--font-mono); font-size: 28px; font-weight: 600; color: var(--accent); letter-spacing: -0.02em; }
.stat-label { font-size: 11px; color: var(--muted-soft); letter-spacing: 0.03em; margin-top: 4px; font-weight: 500; }

/* ============ 弹窗 ============ */
.modal-backdrop {
  position: absolute; inset: 0;
  background: rgba(50, 58, 85, 0.4);
  backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
  z-index: 30; animation: fade-in 0.2s ease;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--surface); border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.5),
    0 8px 24px rgba(40, 50, 80, 0.08),
    0 20px 56px rgba(40, 50, 80, 0.16);
  width: 520px; max-height: 82%; display: flex; flex-direction: column;
  animation: modal-in 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes modal-in {
  from { opacity: 0; transform: scale(0.95) translateY(-12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  padding: 18px 22px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.modal-header h3 { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: -0.01em; flex: 1; color: var(--fg); }
.modal-body { padding: 22px; overflow-y: auto; flex: 1; }
.modal-body::-webkit-scrollbar { width: 5px; }
.modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.modal-footer {
  padding: 14px 22px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0;
}

.btn {
  padding: 9px 18px; border-radius: var(--radius-md); font-size: 13px;
  font-weight: 500; letter-spacing: 0.01em; cursor: pointer;
  transition: all 0.15s; font-family: var(--font-body); border: none;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), #6a82ce);
  color: #fff; box-shadow: 0 1px 3px rgba(85, 112, 184, 0.2);
}
.btn-primary:hover { background: var(--accent-hover); box-shadow: 0 2px 8px rgba(85, 112, 184, 0.35); }
.btn-primary:active { transform: scale(0.97); }
.btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }

.form-group { margin-bottom: 16px; }
.form-label {
  display: block; font-size: 12px; font-weight: 500;
  letter-spacing: 0.02em; color: var(--muted); margin-bottom: 6px;
}
.form-input {
  width: 100%; padding: 9px 13px; border-radius: var(--radius-md);
  border: 1px solid var(--border); font-size: 13px; font-family: var(--font-body);
  color: var(--fg); outline: none; background: var(--chat-bg);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.form-input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(85, 112, 184, 0.06); }

.settings-back-btn {
  width: 30px; height: 30px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 14px; transition: all 0.15s;
}
.settings-back-btn:hover { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

@keyframes menu-in { from { opacity: 0; transform: scale(0.95) translateY(-4px); } to { opacity: 1; transform: scale(1) translateY(0); } }

/* 小窗微调 */
.desktop-window.mini .chat-header-name { font-size: 13px; }
.desktop-window.mini .chat-header-model { font-size: 10px; }
.desktop-window.mini .chat-header-emoji { width: 24px; height: 24px; font-size: 13px; }
.desktop-window.mini .message-body { font-size: 13px; padding: 10px 14px; }
.desktop-window.mini .message-avatar { width: 28px; height: 28px; font-size: 12px; }
.desktop-window.mini .window-controls button { width: 38px; height: 28px; }
.desktop-window.mini .sidebar-top { padding: 10px 8px 8px; }
.desktop-window.mini .assistant-dropdown-btn { font-size: 12px; padding: 6px 8px; }
.desktop-window.mini .sidebar-middle-header { padding: 8px 8px 4px; }
.desktop-window.mini .sidebar-new-chat-btn { font-size: 11px; }
.desktop-window.mini .sidebar-conv-list { padding: 0 4px 2px; }
.desktop-window.mini .conv-item { padding: 6px 8px; }
.desktop-window.mini .conv-item-title { font-size: 12px; }
.desktop-window.mini .sidebar-bottom { padding: 6px 8px; }
.desktop-window.mini .sidebar-settings-btn { font-size: 11px; padding: 6px 0; }
.desktop-window.mini .sidebar-btn { width: 28px; height: 28px; font-size: 13px; }
.desktop-window.mini .control-toggle { font-size: 11px; padding: 4px 8px; }
.desktop-window.mini .upload-btn { font-size: 11px; padding: 4px 8px; }
.desktop-window.mini .send-btn { width: 32px; height: 32px; }
.desktop-window.mini .stop-btn { width: 32px; height: 32px; font-size: 12px; }
.desktop-window.mini .input-container textarea { padding: 12px 14px 4px; }
.desktop-window.mini .input-toolbar { padding: 4px 10px 10px; }
.desktop-window.mini .system-prompt-card { padding: 10px 12px; font-size: 11px; }

.mode-transitioning .sidebar { overflow: hidden; }
.mode-transitioning .message-list { overflow: hidden; }
.mode-transitioning .chat-input-area { overflow: hidden; }

/* ===== 选择文字 ===== */
::selection { background: var(--accent-dim); color: var(--accent); }
</style>

// parse markdown-style code blocks
function renderContent(text) {
  const parts = [];
  let remaining = text;
  const codeRegex = /```(\w*)\n([\s\S]*?)```/g;
  let lastIdx = 0;
  let match;
  while ((match = codeRegex.exec(text)) !== null) {
    if (match.index > lastIdx) {
      parts.push(React.createElement('span', { key: 't' + lastIdx, style: { whiteSpace: 'pre-wrap' } }, text.slice(lastIdx, match.index)));
    }
    parts.push(React.createElement('pre', { key: 'c' + match.index }, React.createElement('code', null, match[2])));
    lastIdx = match.index + match[0].length;
  }
  if (lastIdx < text.length) {
    parts.push(React.createElement('span', { key: 't' + lastIdx, style: { whiteSpace: 'pre-wrap' } }, text.slice(lastIdx)));
  }
  return parts.length === 0 ? React.createElement('span', { style: { whiteSpace: 'pre-wrap' } }, text) : parts;
}

    const iv = setInterval(() => {
      if (ci < aiContent.join('').length) { fc += aiContent.join('')[ci]; setMessages(prev => prev.map(m => m.id === aiId ? { ...m, content: fc } : m)); ci++; }
      else { clearInterval(iv); setMessages(prev => prev.map(m => m.id === aiId ? { ...m, tokens: { prompt: 0, completion: Math.floor(fc.length * 1.3) }, time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) } : m)); setIsStreaming(false); setContextRounds(prev => prev + 1); }
    }, 28);
    streamingRef.current = iv;
  };

  return React.createElement('div', { className: `desktop-window ${mode} ${isTransitioning ? 'mode-transitioning' : ''}`, style: mode === 'mini' ? {} : { width: 1200, height: 800 } },

        React.createElement('button', { className: 'wc-close', title: '关闭 (Alt+F4)' }, React.createElement('svg', { viewBox: '0 0 12 12', fill: 'none', stroke: 'currentColor', strokeWidth: '1.3', strokeLinecap: 'round' }, React.createElement('line', { x1: '3', y1: '3', x2: '9', y2: '9' }), React.createElement('line', { x1: '9', y1: '3', x2: '3', y2: '9' })))

  );
}
